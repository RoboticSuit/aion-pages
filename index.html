<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epinoia</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#000;color:#3ef07a;font:16px/1.7 "Courier New",Consolas,monospace;overflow-x:hidden}
canvas#rain{position:fixed;inset:0;z-index:0;opacity:.4;filter:blur(2.5px) saturate(.9);transform:scale(1.02)}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.85) 100%)}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:64px 20px 40px;min-height:100%}
h1{font-size:1.9rem;letter-spacing:.15em;text-transform:uppercase;margin:0 0 4px;text-shadow:0 0 8px #3ef07a,0 0 18px #1a7a3e}
.sub{color:#8ef0ad;font-style:italic;margin:0 0 28px;opacity:.85}
p{color:#a9f7c2;text-shadow:0 0 3px rgba(62,240,122,.35)}
a{color:#baffce;text-decoration:none;border-bottom:1px dashed #2f8a55}
a:hover{color:#fff;border-bottom-color:#3ef07a}
footer{margin-top:56px;color:#2f8a55;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){canvas#rain{display:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main>
<h1>Epinoia</h1>
<p class="sub">A private working instrument, tended within one household.</p>
<p>What is kept here has no public census and no second keeper. It answers to a single hand alone, and asks nothing of any other.</p>
<p>See the <a href="privacy.html">notice</a> concerning what little it touches.</p>
<footer>Epinoia</footer>
</main>
<script>
(function(){
  try {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    var canvas = document.getElementById("rain");
    var ctx = canvas.getContext("2d");
    var glyphs = "01ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ";
    var fontSize = 16, columns, drops;
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = new Array(columns).fill(0).map(function () { return Math.random() * -50; });
    }
    window.addEventListener("resize", resize);
    resize();
    function frame() {
      ctx.fillStyle = "rgba(0,0,0,0.06)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + "px monospace";
      for (var i = 0; i < columns; i++) {
        var char = glyphs[Math.floor(Math.random() * glyphs.length)];
        var y = drops[i] * fontSize;
        ctx.fillStyle = "rgba(62,240,122," + (0.3 + Math.random() * 0.5) + ")";
        ctx.fillText(char, i * fontSize, y);
        if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (e) { /* purely decorative: never block the page */ }
})();
</script>
</body>
</html>
